[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-agent"
version = "0.1.0"
description = "Post-training and systems optimization of a multimodal neuroscience research agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neuro Agent Team" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "h5py>=3.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
hardware = [
    "torch>=2.1",
]
inference = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.27",
]
train = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.27",
    "peft>=0.10",
    "bitsandbytes>=0.43",
    "datasets>=2.18",
    "trl>=0.15",
]

[project.scripts]
neuro-verify-hardware = "neuro_agent.profiling.hardware:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
