# Base configuration for neuro-agent
# Target hardware: 1x RTX 4090 24GB

project:
  name: neuro-agent
  seed: 42

paths:
  # All persistent caches live under /workspace (not ephemeral overlay)
  workspace_root: /workspace
  hf_home: /workspace/.cache/huggingface
  checkpoints: /workspace/neuro-agent/checkpoints
  results: /workspace/neuro-agent/results

model:
  name: Qwen/Qwen3-4B-Instruct-2507
  dtype: bfloat16
  max_seq_length: 8192
  trust_remote_code: false

training:
  strategy: qlora
  # QLoRA defaults tuned for 24GB VRAM
  lora:
    r: 64
    lora_alpha: 128
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
  quantization:
    load_in_4bit: true
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_epochs: 3
  warmup_ratio: 0.03
  gradient_checkpointing: true

inference:
  dtype: bfloat16
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9

evaluation:
  metrics:
    - ttft_ms
    - tokens_per_second
    - vram_peak_mb
    - kv_cache_mb
  precisions:
    - bf16
    - int8
    - int4

profiling:
  warmup_iters: 3
  benchmark_iters: 10
  output_dir: /workspace/neuro-agent/results/profiling
