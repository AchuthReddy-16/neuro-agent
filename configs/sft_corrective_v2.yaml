# Conservative corrective QLoRA v2 continuation from original SFT adapter

model:
  name: Qwen/Qwen3-4B-Instruct-2507
  trust_remote_code: false
  adapter_path: checkpoints/sft/final

data:
  train_path: data/processed/sft_corrective_v2_mixed.jsonl
  train_subjects: [S001, S002, S003, S004, S005, S006, S007, S008, S009, S010,
                   S011, S012, S013, S014, S015, S016, S017]
  validation_subjects: [S018, S019, S020]
  forbidden_subjects: [S021, S022, S023, S024, S025, S026, S027, S028, S029, S030]

prompt:
  system: >
    You are a neuroscience research assistant. Answer using only the provided
    context. Respond with a concise direct answer only. Do not add unsupported
    interpretation.

qlora:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  seed: 42
  max_seq_length: 2048
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1
  learning_rate: 1.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.0
  gradient_checkpointing: true
  logging_steps: 5
  eval_strategy: epoch
  save_strategy: epoch
  bf16: true
  optim: paged_adamw_8bit
  lr_scheduler_type: cosine

output:
  checkpoint_dir: checkpoints/sft_corrected_v2
  results_dir: results/sft_corrective_v2_training
