# RLVR adapter evaluation on held-out corrected set

model:
  name: Qwen/Qwen3-4B-Instruct-2507
  variant: rlvr_QLoRA_BF16
  dtype: bfloat16
  trust_remote_code: false
  adapter_path: checkpoints/rlvr/final

inference:
  seed: 42
  do_sample: false
  max_new_tokens: 128
  use_cache: true
  temperature: 0.0
  top_p: 1.0

evaluation:
  dataset: data/processed/eval_heldout_corrected.jsonl
  held_out_subjects: [S026, S027, S028, S029, S030]
  train_subjects: [S001, S002, S003, S004, S005, S006, S007, S008, S009, S010,
                   S011, S012, S013, S014, S015, S016, S017, S018, S019, S020]
  validation_subjects: [S021, S022, S023, S024, S025]
  targeted_categories:
    - execution_vs_imagery
    - movement_task_classification
    - channel_ranking
    - band_power_analysis

gate:
  execution_vs_imagery_min: 0.95
  movement_task_classification_min: 0.68
  channel_ranking_min: 0.77
  band_power_analysis_min: 0.83
  reference:
    execution_vs_imagery: 1.0
    movement_task_classification: 0.728
    channel_ranking: 0.816
    band_power_analysis: 0.880

prompt:
  system: >
    You are a neuroscience research assistant. Answer using only the provided
    context. Respond with a concise direct answer only. Do not add unsupported
    interpretation.

output:
  dir: results/rlvr_model_eval
  targeted_dir: results/rlvr_targeted_eval

comparison:
  base_dir: results/base_model_eval
  sft_dir: results/sft_model_eval
  corrected_dir: results/sft_corrected_v2_eval
  rlvr_dir: results/rlvr_model_eval
  output_path: results/model_comparison/base_vs_sft_vs_corrected_v2_vs_rlvr.json
