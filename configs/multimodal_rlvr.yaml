# Conservative GRPO multimodal RLVR from corrected SFT adapter (Stage F.2)

model:
  name: Qwen/Qwen2.5-VL-3B-Instruct
  trust_remote_code: true
  freeze_vision_tower: true
  adapter_path: checkpoints/multimodal_sft_corrected/final

data:
  train_path: data/processed/vision/multimodal_rlvr_train.jsonl
  forbidden_subjects: [S026, S027, S028, S029, S030]

prompt:
  system: >
    You are a neuroscience research assistant analyzing EEG-derived plots.
    Use the provided image and context. Respond with ONLY the direct answer —
    a single label, channel name, number, or comma-separated list.
    Never add explanation, units, or supporting values.

qlora:
  load_in_4bit: true
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  seed: 42
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  steps_per_generation: 2
  max_steps: 120
  num_generations: 2
  max_completion_length: 32
  learning_rate: 5.0e-7
  beta: 0.04
  sync_ref_model: false
  ref_model_sync_steps: 64
  temperature: 1.0
  top_p: 1.0
  gradient_checkpointing: true
  logging_steps: 5
  save_strategy: steps
  save_steps: 40
  save_total_limit: 2
  bf16: true
  log_completions: false

output:
  checkpoint_dir: checkpoints/multimodal_rlvr
  results_dir: results/multimodal_rlvr_training

evaluation:
  dataset: data/processed/vision/multimodal_eval_heldout.jsonl
  held_out_subjects: [S026, S027, S028, S029, S030]

inference:
  seed: 42
  do_sample: false
  max_new_tokens: 32
  use_cache: true
  temperature: 0.0
  top_p: 1.0
  dtype: bfloat16

eval_output:
  dir: results/multimodal_rlvr_eval

gate:
  baseline_dir: results/multimodal_corrected_eval
  output_dir: results/multimodal_rlvr_targeted_gate
  categorical_floor_pp: 5.0
  ranking_floor_pp: 5.0
  numeric_floor_pp: 5.0
  baseline_rates:
    categorical: 0.6945812807881774
    ranking: 0.5353535353535354
    numeric: 0.2875
    set: 0.0
    waveform_max_rms_numeric: 0.25
    spectrogram_peak_frequency: 0.24242424242424243

comparison:
  base_dir: results/multimodal_base_eval
  sft_dir: results/multimodal_sft_eval
  corrected_dir: results/multimodal_corrected_eval
  rlvr_dir: results/multimodal_rlvr_eval
  output_path: results/model_comparison/multimodal_base_vs_sft_vs_corrected_vs_rlvr.json
